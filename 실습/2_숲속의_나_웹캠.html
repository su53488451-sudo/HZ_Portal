<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>숲 속의 나 · 두 번째 포털</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #06100e; color: #eef7ee; font-family: "Malgun Gothic", sans-serif; }
    button { font: inherit; }
    .scene {
      --x: 50%; --y: 50%;
      position: relative; height: 100svh; min-height: 540px; overflow: hidden;
      isolation: isolate; touch-action: none; user-select: none; background: #06100e;
    }
    .forest, .shade, .darkness, .spotlight, .stars { position: absolute; inset: 0; pointer-events: none; }
    .forest {
      z-index: -4; background: url("assets/forest-clearing.png") center / cover no-repeat;
      filter: brightness(.68) saturate(.9); transform: scale(1.04);
      transition: filter 1s, transform 2s;
    }
    .scene.is-awake .forest { filter: brightness(1.17) saturate(1.14); transform: scale(1); }
    .shade { z-index: -3; background: linear-gradient(90deg, #02100fc7, #02100f38 55%, #02100f20), linear-gradient(0deg, #02100fc2, transparent 38%); }
    .darkness { z-index: -2; background: #000b0dca; transition: opacity .85s; }
    .spotlight {
      z-index: -2; opacity: 0; transition: opacity .85s;
      background: radial-gradient(circle 310px at var(--x) var(--y), transparent 0%, #0010102b 42%, #001010d6 100%);
    }
    .scene.has-light { cursor: none; }
    .scene.has-light .darkness { opacity: 0; }
    .scene.has-light .spotlight { opacity: 1; }
    .stars {
      z-index: -1; opacity: 0; transition: opacity .5s;
      -webkit-mask-image: radial-gradient(circle 290px at var(--x) var(--y), #000 0%, #000 38%, transparent 100%);
      mask-image: radial-gradient(circle 290px at var(--x) var(--y), #000 0%, #000 38%, transparent 100%);
    }
    .scene.has-light .stars { opacity: 1; }
    .stars::before, .stars::after { content: ""; position: absolute; inset: 0; animation: twinkle 2.5s ease-in-out infinite alternate; }
    .stars::before { background: radial-gradient(circle, #e9f8cf 1.5px, transparent 3px) 8% 30% / 241px 199px; }
    .stars::after { background: radial-gradient(circle, #ffe4a5 1px, transparent 3px) 70% 62% / 317px 253px; animation-duration: 3.2s; animation-delay: -1.1s; }
    @keyframes twinkle { from { opacity: .15; } to { opacity: 1; } }
    .trail { position: absolute; z-index: 1; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .lantern {
      position: absolute; z-index: 3; left: var(--x); top: var(--y); width: 104px; height: 146px;
      transform: translate(-50%, -57%); pointer-events: none; opacity: 0; transition: opacity .6s;
    }
    .scene.has-light .lantern { opacity: 1; }
    .lantern::before { content: ""; position: absolute; left: 51px; top: -38px; width: 2px; height: 43px; background: #baad7e; }
    .lantern::after {
      content: ""; position: absolute; left: -123px; top: -93px; width: 350px; height: 350px; border-radius: 50%;
      background: radial-gradient(circle, #c5eabe88, transparent 62%); filter: blur(28px); mix-blend-mode: screen;
    }
    .lantern-roof { position: absolute; z-index: 2; left: 15px; top: 7px; width: 74px; height: 17px; background: linear-gradient(#dfcc98, #6e6646); clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%); }
    .lantern-glass { position: absolute; z-index: 1; left: 24px; top: 22px; width: 56px; height: 78px; border: 5px solid #9d956b; border-top: 0; background: #c6e9ad25; clip-path: polygon(0 0, 100% 0, 88% 100%, 12% 100%); }
    .lantern-flame { position: absolute; left: 17px; top: 18px; width: 13px; height: 25px; border-radius: 80% 0 70% 50%; transform: rotate(36deg); background: #e8ffd1; box-shadow: 0 0 24px 14px #b7edb5a8; }
    .lantern-base { position: absolute; z-index: 2; left: 21px; top: 100px; width: 62px; height: 14px; border-radius: 0 0 50% 50%; background: linear-gradient(#bfae7a, #494637); }
    .portal {
      position: absolute; z-index: 2; left: var(--portal-x, 50%); top: var(--portal-y, 50%);
      width: clamp(190px, 26vw, 285px); aspect-ratio: 1; border-radius: 50%; overflow: hidden;
      transform: translate(-50%, -50%) scale(.7); opacity: 0; pointer-events: none;
      border: 5px solid #d5f4d5; background: #071814;
      box-shadow: 0 0 0 8px #d2f6ca2b, 0 0 48px 12px #a8edbd78, inset 0 0 35px #071814;
      transition: opacity .8s, transform .8s;
    }
    .portal.open { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    .portal video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    .portal::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 35px 17px #06140e82; }
    .topline, .bottomline { position: absolute; z-index: 4; left: clamp(24px, 5vw, 80px); right: clamp(24px, 5vw, 80px); display: flex; justify-content: space-between; align-items: center; gap: 20px; }
    .topline { top: 34px; } .bottomline { bottom: 30px; align-items: end; }
    .brand { margin: 0; font: 16px Georgia, serif; letter-spacing: .2em; color: #d9edda; }
    .bottomline p { margin: 0; font-size: 12px; line-height: 1.8; text-shadow: 0 1px 12px #00120c; }
    .status { max-width: 380px; text-align: right; color: #d5e7d9; }
    #stop { display: none; border: 1px solid #e1f1d67a; border-radius: 100px; padding: 11px 17px; color: inherit; background: #06201bbc; cursor: pointer; }
    #stop.visible { display: block; }
    #stop:focus-visible { outline: 2px solid #f4ffe9; outline-offset: 3px; }
    @media (max-width: 700px) {
      .topline, .bottomline { left: 24px; right: 24px; }
      .topline { top: 24px; } .bottomline { bottom: 20px; display: block; }
      .brand { font-size: 12px; } .status { text-align: left; margin-top: 7px !important; }
      .lantern { transform: translate(-50%, -57%) scale(.82); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
      .stars::before, .stars::after { animation: none; opacity: .8; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene" aria-label="드래그로 웹캠 포털을 여는 숲">
    <div class="forest"></div><div class="shade"></div><div class="darkness"></div><div class="spotlight"></div><div class="stars"></div>
    <canvas class="trail" id="trail" aria-hidden="true"></canvas>
    <header class="topline"><p class="brand">FOREST OF ME / 02</p><button id="stop" type="button">웹캠 끄기</button></header>
    <div class="portal" id="portal" aria-label="웹캠 속 내 모습"><video id="camera" autoplay muted playsinline></video></div>
    <div class="lantern" aria-hidden="true"><div class="lantern-roof"></div><div class="lantern-glass"><div class="lantern-flame"></div></div><div class="lantern-base"></div></div>
    <footer class="bottomline">
      <p>마우스를 눌러 숲을 드래그해 보세요.<br>등불이 길을 비추고, 웹캠 포털이 열립니다.</p>
      <p class="status" id="status" role="status">첫 드래그에서 카메라 사용을 허용해 주세요.</p>
    </footer>
  </main>
  <script>
    const scene = document.querySelector("#scene");
    const portal = document.querySelector("#portal");
    const camera = document.querySelector("#camera");
    const status = document.querySelector("#status");
    const stopButton = document.querySelector("#stop");
    const trail = document.querySelector("#trail");
    const ink = trail.getContext("2d");
    let stream = null;
    let starting = null;
    let stroke = null;
    let revealRequested = false;

    function sizeTrail() {
      const bounds = scene.getBoundingClientRect();
      const scale = Math.min(devicePixelRatio || 1, 2);
      trail.width = Math.round(bounds.width * scale);
      trail.height = Math.round(bounds.height * scale);
      ink.setTransform(scale, 0, 0, scale, 0, 0);
      ink.lineCap = "round";
      ink.lineJoin = "round";
    }
    function drawTrail(x, y) {
      if (!stroke || Math.hypot(x - stroke.lastX, y - stroke.lastY) < 1) return;
      ink.save();
      ink.globalCompositeOperation = "screen";
      for (const [width, color, blur] of [
        [18, "rgba(150, 237, 184, .2)", 20],
        [6, "rgba(184, 255, 215, .65)", 12],
        [2, "rgba(250, 255, 231, .95)", 4]
      ]) {
        ink.beginPath();
        ink.moveTo(stroke.lastX, stroke.lastY);
        ink.lineTo(x, y);
        ink.lineWidth = width;
        ink.strokeStyle = color;
        ink.shadowColor = "#c4ffdc";
        ink.shadowBlur = blur;
        ink.stroke();
      }
      ink.restore();
      stroke.lastX = x;
      stroke.lastY = y;
    }
    addEventListener("resize", sizeTrail);
    sizeTrail();

    function placeLight(clientX, clientY) {
      const bounds = scene.getBoundingClientRect();
      scene.style.setProperty("--x", Math.max(0, Math.min(bounds.width, clientX - bounds.left)) + "px");
      scene.style.setProperty("--y", Math.max(0, Math.min(bounds.height, clientY - bounds.top)) + "px");
      scene.classList.add("has-light", "is-awake");
    }
    function placePortal(x, y) {
      const bounds = scene.getBoundingClientRect();
      const radius = Math.min(285, Math.max(190, bounds.width * .26)) / 2 + 18;
      portal.style.setProperty("--portal-x", Math.max(radius, Math.min(bounds.width - radius, x)) + "px");
      portal.style.setProperty("--portal-y", Math.max(radius, Math.min(bounds.height - radius, y)) + "px");
    }
    function stopCamera() {
      stream?.getTracks().forEach(track => track.stop());
      stream = null;
      camera.srcObject = null;
      portal.classList.remove("open");
      stopButton.classList.remove("visible");
      revealRequested = false;
      status.textContent = "다시 드래그하면 웹캠 포털을 열 수 있어요.";
    }
    async function ensureCamera() {
      if (stream) return;
      if (starting) return starting;
      status.textContent = "카메라를 준비하고 있어요…";
      starting = (async () => {
        const nextStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        try {
          camera.srcObject = nextStream;
          await camera.play();
          stream = nextStream;
          stopButton.classList.add("visible");
          if (revealRequested) portal.classList.add("open");
          status.textContent = "웹캠 포털이 열렸어요. 다시 드래그하면 위치를 옮길 수 있어요.";
        } catch (error) {
          nextStream.getTracks().forEach(track => track.stop());
          camera.srcObject = null;
          throw error;
        }
      })().catch(error => {
        revealRequested = false;
        status.textContent = error.name === "NotAllowedError"
          ? "크롬에서 카메라 사용을 허용한 뒤 다시 드래그해 주세요."
          : "카메라를 시작하지 못했어요. 웹캠 연결을 확인해 주세요.";
      }).finally(() => { starting = null; });
      return starting;
    }
    scene.addEventListener("pointermove", event => {
      if (event.pointerType !== "mouse" && event.pointerType !== "pen") return;
      placeLight(event.clientX, event.clientY);
      if (!stroke || event.pointerId !== stroke.id) return;
      const bounds = scene.getBoundingClientRect();
      drawTrail(event.clientX - bounds.left, event.clientY - bounds.top);
      if (Math.hypot(event.clientX - stroke.clientX, event.clientY - stroke.clientY) < 40) return;
      if (!stroke.opened) {
        stroke.opened = true;
        revealRequested = true;
        placePortal(stroke.x, stroke.y);
        if (stream) { portal.classList.add("open"); status.textContent = "웹캠 포털이 열렸어요. 다시 드래그하면 위치를 옮길 수 있어요."; }
        else if (navigator.mediaDevices?.getUserMedia) void ensureCamera();
        else status.textContent = "크롬에서 localhost 또는 HTTPS 주소로 열어 주세요.";
      }
    });
    scene.addEventListener("pointerdown", event => {
      if (event.button !== 0 || event.target.closest("button")) return;
      const bounds = scene.getBoundingClientRect();
      ink.clearRect(0, 0, bounds.width, bounds.height);
      stroke = { id: event.pointerId, clientX: event.clientX, clientY: event.clientY, x: event.clientX - bounds.left, y: event.clientY - bounds.top, lastX: event.clientX - bounds.left, lastY: event.clientY - bounds.top, opened: false };
      scene.setPointerCapture(event.pointerId);
      placeLight(event.clientX, event.clientY);
    });
    scene.addEventListener("pointerup", event => {
      if (stroke?.id !== event.pointerId) return;
      const bounds = scene.getBoundingClientRect();
      drawTrail(event.clientX - bounds.left, event.clientY - bounds.top);
      stroke = null;
    });
    scene.addEventListener("pointercancel", () => { stroke = null; });
    stopButton.addEventListener("click", stopCamera);
    window.addEventListener("pagehide", () => { if (stream) stopCamera(); });
  </script>
</body>
</html>
