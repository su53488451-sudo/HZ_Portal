// Mirror and fit the whole camera view inside the portal, independent of its location.
function drawPortalSelf(x,y,r,t){
  if(!stream||!backgroundReady||video.readyState<2||!video.videoWidth)return;
  const size=r*2,scale=Math.max(size/(backgroundReady?bw:video.videoWidth),size/(backgroundReady?bh:video.videoHeight));
  const vw=(backgroundReady?bw:video.videoWidth)*scale,vh=(backgroundReady?bh:video.videoHeight)*scale;
  ctx.save();
  ctx.translate(x,y);ctx.scale(-1,1);
  ctx.globalAlpha=.88;
  ctx.filter='saturate(0.7) contrast(1.15)';
  ctx.drawImage(backgroundReady?person:video,-vw/2,-vh/2,vw,vh);
  ctx.filter='none';ctx.globalAlpha=1;
  // Color the live reflection to make it feel part of the other world.
  ctx.globalCompositeOperation='screen';
  const tint=ctx.createLinearGradient(0,-r,0,r);
  tint.addColorStop(0,'rgba(207,235,166,.12)');
  tint.addColorStop(1,'rgba(62,146,83,.12)');
  ctx.fillStyle=tint;ctx.fillRect(-r,-r,size,size);

 try{await segmenter.send({image:video});}catch(e){status.textContent='인물 분리를 불러오지 못했어요. 인터넷 연결 후 웹캠을 다시 켜 주세요.';processing=false;return;}
 setTimeout(processCamera,45);
}
function updateBackground(results){

 for(let i=0;i<known.length;i++){const k=i*4;if(m.data[k]<20){known[i]=1;out.data[k]=frame.data[k];out.data[k+1]=frame.data[k+1];out.data[k+2]=frame.data[k+2];out.data[k+3]=255;}}

const fragmentSource=`
precision highp float;

 vec2 grid=floor(p.xz/4.);
 // Four neighboring blocks prevent tall towers from disappearing at cell boundaries.
 for(int i=0;i<2;i++)for(int j=0;j<2;j++){
  vec2 id=grid+vec2(float(i),float(j)),center=id*4.;
  if(abs(center.x)<2.)continue;

precision highp float;

   float path=1.-smoothstep(.6,1.7,abs(p.x-.3*sin(p.z*.25)));

 // Warm shafts between the tree crowns, softened by the forest mist.
 float rays=pow(max(0.,sin(rd.x*28.+rd.y*14.+.1*sin(time*.1))),14.);

function initWorld(){
 try{
  gl=world.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:true,powerPreference:'high-performance'});
  if(!gl)return;
  const compile=(type,source)=>{const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(shader));return shader;};

  gl.attachShader(worldProgram,vs);gl.attachShader(worldProgram,fs);gl.bindAttribLocation(worldProgram,0,'position');gl.linkProgram(worldProgram);
  gl.deleteShader(vs);gl.deleteShader(fs);
  if(!gl.getProgramParameter(worldProgram,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(worldProgram));
  gl.useProgram(worldProgram);
  const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const attr=gl.getAttribLocation(worldProgram,'position');gl.enableVertexAttribArray(attr);gl.vertexAttribPointer(attr,2,gl.FLOAT,false,0,0);

  gl.attachShader(destinationProgram,destinationVS);gl.attachShader(destinationProgram,destinationFS);gl.bindAttribLocation(destinationProgram,0,'position');gl.linkProgram(destinationProgram);
  gl.deleteShader(destinationVS);gl.deleteShader(destinationFS);
  if(!gl.getProgramParameter(destinationProgram,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(destinationProgram));
  for(const name of ['resolution','mouse','time'])destinationUniforms[name]=gl.getUniformLocation(destinationProgram,name);
 }catch(error){console.warn('3D background unavailable:',error);gl=null;worldProgram=null;destinationProgram=null;}
}
world.addEventListener('webglcontextlost',e=>{e.preventDefault();worldLost=true;});
world.addEventListener('webglcontextrestored',()=>{worldLost=false;initWorld();});
initWorld();
let quality=1,lastWorldFrame=-Infinity,previousTime=0,slowFrames=0;
function renderWorld(t){
 if(gl&&worldProgram&&!worldLost){
  const scale=Math.min(1,Math.sqrt(620000/Math.max(1,w*h)))*quality;
  const ww=Math.max(1,Math.round(w*scale)),hh=Math.max(1,Math.round(h*scale));
  if(world.width!==ww||world.height!==hh){world.width=ww;world.height=hh;}
  gl.viewport(0,0,ww,hh);gl.useProgram(worldProgram);
  gl.uniform2f(worldUniforms.resolution,ww,hh);gl.uniform2f(worldUniforms.mouse,view.x,view.y);gl.uniform1f(worldUniforms.time,reducedMotion.matches?0:t*.001);
  gl.drawArrays(gl.TRIANGLES,0,3);
  ctx.drawImage(world,0,0,w,h);
 }else{
  const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#091024');bg.addColorStop(.6,'#293c57');bg.addColorStop(1,'#0b1421');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);
  // The fallback keeps the same city identity when WebGL is unavailable.
  for(let layer=0;layer<3;layer++)for(let i=0;i<32;i++){
   const seed=(Math.sin(i*127.1+layer*71.7)+1)*.5,bw=w/27,px=i*w/30-bw*.5,top=h*(.2+seed*.42+layer*.09);
   ctx.fillStyle=['#233249','#182337','#0d1626'][layer];ctx.fillRect(px,top,bw,h-top);
   for(let row=0;row<32;row++)for(let col=0;col<4;col++){
    if(Math.sin(i*31+row*17+col*11+layer)<.1)continue;
    ctx.fillStyle=i%3?'#d4ae72':'#8cb8de';ctx.globalAlpha=.25+layer*.15;ctx.fillRect(px+4+col*(bw-6)/4,top+8+row*12,Math.max(1,bw/10),3);
   }ctx.globalAlpha=1;
  }

}
function drawParticles(t){
 ctx.save();ctx.globalCompositeOperation='screen';
 for(let i=0;i<34;i++){
  const depth=.3+(i%7)/7,x=((Math.sin(i*127.1)*.5+.5)*w+Math.sin(t*.00012+i)*22*depth+w)%w;
  const y=((i*97.7-t*.004*depth)%h+h)%h;
  ctx.globalAlpha=(.15+.15*Math.sin(i+t*.0007))*depth;
  ctx.strokeStyle='#a5c9e0';ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-2*depth,y+9*depth);ctx.stroke();
 }ctx.restore();
}
function drawOpenPortal(t){
 const{x,y,r,born}=portal,open=Math.min(1,(t-born)/650),R=r*(1-Math.pow(1-open,3));
 if(R<.1)return;

  // Reuse the WebGL buffer after the exterior has been copied onto the main canvas.
  // Only a small square is rendered for the portal; the full-screen world stays untouched.
  const side=Math.max(1,Math.min(world.width,world.height,512,Math.ceil(r*2)));
  gl.viewport(0,0,side,side);gl.useProgram(destinationProgram);
  gl.uniform2f(destinationUniforms.resolution,side,side);gl.uniform2f(destinationUniforms.mouse,view.x,view.y);
  gl.uniform1f(destinationUniforms.time,reducedMotion.matches?0:t*.001);gl.drawArrays(gl.TRIANGLES,0,3);

 }else{
  const sky=ctx.createLinearGradient(x,y-r,x,y+r);sky.addColorStop(0,'#79917a');sky.addColorStop(.6,'#3e6849');sky.addColorStop(1,'#153725');
  ctx.fillStyle=sky;ctx.fillRect(x-r,y-r,r*2,r*2);
  ctx.fillStyle='#787656';ctx.beginPath();ctx.moveTo(x-r*.08,y);ctx.lineTo(x+r*.08,y);ctx.lineTo(x+r*.6,y+r);ctx.lineTo(x-r*.6,y+r);ctx.fill();
  for(let layer=0;layer<3;layer++)for(let i=0;i<10;i++){
   const px=x+(i<5?-1:1)*r*(.18+(i%5)*.22),py=y+r*(.12+layer*.32),size=r*(.23+layer*.09);
   ctx.fillStyle=['#536d4e','#304f32','#183923'][layer];ctx.fillRect(px-size*.1,py-r*1.4,size*.2,r*1.5);
   for(let k=0;k<3;k++){ctx.beginPath();ctx.ellipse(px+Math.sin(i+k)*size*.4,py-r*(.9+k*.24),size*(.9+k*.1),size*.7,0,0,Math.PI*2);ctx.fill();}
  }
 }
 const light=ctx.createRadialGradient(x,y-r*.25,0,x,y,r);
 light.addColorStop(0,'#e4f2c908');light.addColorStop(.7,'#8acb8608');light.addColorStop(1,'#061e13aa');ctx.fillStyle=light;ctx.fillRect(x-r,y-r,2*r,2*r);
 drawPortalSelf(x,y,r,t);ctx.restore();
 ctx.save();ctx.globalAlpha=open;
 for(const [width,blur,color] of [[8,38,'#88bf9a55'],[3,18,'#c2e4c1'],[1,4,'#f1f7df']]){
  ctx.strokeStyle=color;ctx.shadowColor='#a7d7a0';ctx.shadowBlur=blur;ctx.lineWidth=width;ctx.beginPath();ctx.arc(x,y,R,0,Math.PI*2);ctx.stroke();
 }
 ctx.shadowBlur=8;
 for(let i=0;i<65;i++){const a=i*2.399+t*.0003,rr=R+Math.sin(i*8+t*.002)*9;ctx.fillStyle=i%3?'#c4e8b5':'#f5f3d6';ctx.beginPath();ctx.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,1+Math.sin(i)*.6,0,7);ctx.fill();}
 ctx.restore();
}
function frame(t){
 requestAnimationFrame(frame);
 if(document.hidden)return;
 // Cap at 30fps and reduce resolution if the device cannot sustain it.
 if(t-lastWorldFrame<32)return;
 if(previousTime&&t-previousTime>65){if(++slowFrames>25){quality=Math.max(.55,quality*.85);slowFrames=0;}}else slowFrames=Math.max(0,slowFrames-1);
 previousTime=t;lastWorldFrame=t;
 view.x+=(pointer.x-view.x)*.055;view.y+=(pointer.y-view.y)*.055;
 const sceneTime=reducedMotion.matches?0:t;
 if(reducedMotion.matches){view.x=0;view.y=0;}
 ctx.clearRect(0,0,w,h);renderWorld(sceneTime);drawParticles(sceneTime);
 // Keep text readable without flattening the 3D scene.
 const scrim=ctx.createLinearGradient(0,0,w*.65,0);scrim.addColorStop(0,'#080b1166');scrim.addColorStop(1,'#080b1100');ctx.fillStyle=scrim;ctx.fillRect(0,0,w,h);
 if(portal)drawOpenPortal(t);
 if(points.length){ctx.save();ctx.strokeStyle='#dbf3d0';ctx.lineWidth=3;ctx.lineCap='round';ctx.shadowColor='#a4d7a1';ctx.shadowBlur=14;ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();}
}
requestAnimationFrame(frame);
