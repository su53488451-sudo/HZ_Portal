<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>숲 속의 나 · 첫 만남</title>
  <style>
    :root { color-scheme: dark; font-family: "Malgun Gothic", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #06100e; color: #f5f3e9; }
    button { font: inherit; }
    .scene {
      --light: #b9e8a1; --wash: rgba(67, 139, 103, .3); --hue: 0deg;
      --light-x: 50%; --light-y: 50%;
      position: relative; min-height: 100svh; overflow: hidden; isolation: isolate;
      background: #06100e; touch-action: none; user-select: none;
    }
    .scene[data-theme="blue"] { --light: #9edaf8; --wash: rgba(31, 93, 175, .43); --hue: 78deg; }
    .scene[data-theme="pink"] { --light: #ffc4df; --wash: rgba(185, 63, 132, .37); --hue: 205deg; }
    .forest, .shade, .color, .stars, .darkness, .spotlight { position: absolute; inset: 0; pointer-events: none; }
    .forest {
      z-index: -4; background: url("assets/forest-clearing.png") center / cover no-repeat;
      filter: hue-rotate(var(--hue)) brightness(.63) saturate(.87);
      transform: scale(1.045); transition: filter 1s, transform 2s;
    }
    .scene.is-awake .forest { filter: hue-rotate(var(--hue)) brightness(1.18) saturate(1.18); transform: scale(1); }
    .color { z-index: -1; background: radial-gradient(circle 260px at var(--light-x) var(--light-y), var(--wash), transparent 85%); opacity: 0; transition: opacity 1.1s, background 1s; }
    .scene.is-awake .color { opacity: 1; }
    .shade { z-index: -2; background: linear-gradient(90deg, rgba(2, 10, 11, .83) 0%, rgba(2, 10, 11, .37) 46%, rgba(2, 10, 11, .08) 100%), linear-gradient(0deg, rgba(2, 10, 11, .78), transparent 33%, rgba(2, 10, 11, .3)); }
    .darkness { z-index: -1; background: rgba(0, 5, 6, .77); transition: opacity 1.1s; }
    .spotlight { z-index: -1; background: radial-gradient(circle 290px at var(--light-x) var(--light-y), transparent 0%, rgba(0, 5, 6, .16) 38%, rgba(0, 5, 6, .79) 100%); opacity: 0; transition: opacity 1.1s; }
    .scene.has-pointer { cursor: none; }
    .scene.has-pointer .darkness { opacity: 0; }
    .scene.has-pointer .spotlight { opacity: 1; }
    .stars {
      z-index: -1; opacity: 0; transition: opacity .7s;
      -webkit-mask-image: radial-gradient(circle 280px at var(--light-x) var(--light-y), #000 0%, #000 42%, transparent 100%);
      mask-image: radial-gradient(circle 280px at var(--light-x) var(--light-y), #000 0%, #000 42%, transparent 100%);
    }
    .scene.has-pointer .stars { opacity: 1; }
    .stars::before, .stars::after { content: ""; position: absolute; inset: 0; animation: twinkle 2.2s ease-in-out infinite alternate; }
    .stars::before { background: radial-gradient(circle, #ffe7a8 1.5px, transparent 3px) 8% 30% / 241px 199px; }
    .stars::after { background: radial-gradient(circle, #d7ffdc 1px, transparent 3px) 70% 62% / 317px 253px; animation-duration: 3.1s; animation-delay: -1.4s; }
    @keyframes twinkle { from { opacity: .18; } to { opacity: 1; } }
    .topline { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 36px clamp(24px, 5vw, 80px); }
    .brand { margin: 0; color: #d5e8d5; font-family: Georgia, serif; font-size: 16px; letter-spacing: .19em; }
    .camera-button { border: 1px solid #d8e9d47a; border-radius: 100px; padding: 12px 19px; color: #f7f8ed; background: #061a1a9c; backdrop-filter: blur(10px); cursor: pointer; }
    .camera-button:hover, .camera-button:focus-visible { background: #294640dd; outline: 2px solid #e9f7d9; outline-offset: 3px; }
    .lantern { position: absolute; left: var(--light-x); top: var(--light-y); width: 130px; height: 280px; transform: translate(-50%, -56%) scale(.66); pointer-events: none; opacity: 0; transition: opacity .8s; }
    .scene.has-pointer .lantern { opacity: 1; }
    .cord { position: absolute; top: 0; left: 50%; width: 2px; height: 100px; background: linear-gradient(#232b23, #b29d68); }
    .lantern-body { position: absolute; top: 97px; left: 21px; width: 88px; height: 110px; filter: drop-shadow(0 8px 11px #07150f); }
    .lantern-body::before { content: ""; position: absolute; top: -16px; left: 30px; width: 28px; height: 16px; border: 3px solid #bca87a; border-bottom: 0; border-radius: 50% 50% 0 0; }
    .roof { position: absolute; top: 1px; left: 1px; width: 86px; height: 18px; background: linear-gradient(#dfcf9d, #524933); clip-path: polygon(22% 0, 78% 0, 100% 100%, 0 100%); }
    .glass { position: absolute; top: 18px; left: 11px; width: 66px; height: 76px; border: 6px solid #837a55; border-top: 0; background: #a4a06d22; clip-path: polygon(0 0, 100% 0, 89% 100%, 11% 100%); }
    .glass::after { content: ""; position: absolute; left: 50%; top: 0; width: 3px; height: 100%; background: #8f825d; }
    .base { position: absolute; bottom: 0; left: 8px; width: 72px; height: 16px; border-radius: 0 0 50% 50%; background: linear-gradient(#c2aa73, #3c3b2d); }
    .flame { position: absolute; left: 35px; top: 47px; width: 18px; height: 28px; border-radius: 80% 0 70% 50%; transform: rotate(36deg); background: var(--light); opacity: 0; box-shadow: 0 0 25px 14px var(--light); transition: opacity 1s, background 1s, box-shadow 1s; }
    .halo { position: absolute; top: -20px; left: -105px; width: 340px; height: 340px; border-radius: 50%; background: radial-gradient(circle, var(--light), transparent 62%); mix-blend-mode: screen; filter: blur(28px); opacity: 0; transition: opacity 1.1s, background 1s; }
    .scene.is-awake .flame { opacity: .9; }
    .scene.is-awake .halo { opacity: .32; }
    .bottomline { position: absolute; left: clamp(24px, 5vw, 80px); right: clamp(24px, 5vw, 80px); bottom: 30px; display: flex; justify-content: space-between; align-items: end; gap: 20px; color: #dde9de; font-size: 12px; line-height: 1.8; }
    .bottomline p { margin: 0; }
    .status { max-width: 340px; text-align: right; color: #cfe6d5; }
    video { display: none; }
    @media (max-width: 700px) {
      .topline { padding: 24px; } .brand { font-size: 12px; } .camera-button { font-size: 12px; padding: 10px 13px; }
      .lantern { transform: translate(-50%, -56%) scale(.58); }
      .bottomline { left: 24px; right: 24px; bottom: 20px; flex-direction: column; align-items: start; gap: 4px; font-size: 11px; }
      .status { text-align: left; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; } .stars::before, .stars::after { animation: none; opacity: .8; } }
  </style>
</head>
<body>
  <main class="scene" id="scene" data-theme="green">
    <div class="forest"></div><div class="color"></div><div class="shade"></div><div class="darkness"></div><div class="spotlight"></div><div class="stars"></div>
    <header class="topline">
      <p class="brand">FOREST OF ME</p>
      <button class="camera-button" id="cameraButton" type="button">웹캠으로 손짓하기</button>
    </header>
    <div class="lantern" aria-hidden="true">
      <div class="cord"></div><div class="halo"></div>
      <div class="lantern-body"><div class="roof"></div><div class="glass"></div><div class="flame"></div><div class="base"></div></div>
    </div>
    <footer class="bottomline">
      <p>마우스 이동 · 등불 켜기<br>클릭 · 색 순서대로 바꾸기 &nbsp; / &nbsp; 드래그 · 위치로 색 고르기</p>
      <p class="status" id="status" role="status">손짓을 사용하려면 웹캠 버튼을 눌러 주세요.</p>
    </footer>
    <video id="camera" autoplay muted playsinline></video>
  </main>
  <script type="module">
    const scene = document.querySelector("#scene");
    const status = document.querySelector("#status");
    const cameraButton = document.querySelector("#cameraButton");
    const camera = document.querySelector("#camera");
    const themes = ["green", "blue", "pink"];
    const names = ["초록", "푸른", "분홍"];
    let themeIndex = 0;
    let pointerStart = null;
    let stream = null;
    let handLandmarker = null;
    let lastVideoTime = -1;
    let lastCheck = 0;
    let lastHand = null;
    let lastThemeChange = 0;
    let cameraFrame = 0;

    function wake() {
      if (scene.classList.contains("is-awake")) return;
      scene.classList.add("is-awake");
    }
    function setTheme(index) {
      if (index === themeIndex) return;
      themeIndex = index;
      scene.dataset.theme = themes[index];
      status.textContent = names[index] + "빛 숲이 열렸어요.";
    }
    function moveLight(clientX, clientY) {
      const bounds = scene.getBoundingClientRect();
      scene.style.setProperty("--light-x", Math.max(0, Math.min(bounds.width, clientX - bounds.left)) + "px");
      scene.style.setProperty("--light-y", Math.max(0, Math.min(bounds.height, clientY - bounds.top)) + "px");
      scene.classList.add("has-pointer");
    }
    scene.addEventListener("pointermove", event => {
      if (event.pointerType === "mouse" || event.pointerType === "pen") { moveLight(event.clientX, event.clientY); wake(); }
    });
    scene.addEventListener("pointerleave", event => {
      if (event.pointerType === "mouse" || event.pointerType === "pen") scene.classList.remove("has-pointer");
    });
    scene.addEventListener("pointerdown", event => {
      if (event.target.closest("button") || event.button !== 0) return;
      moveLight(event.clientX, event.clientY);
      wake();
      pointerStart = { id: event.pointerId, x: event.clientX };
      scene.setPointerCapture(event.pointerId);
    });
    scene.addEventListener("pointerup", event => {
      if (!pointerStart || event.pointerId !== pointerStart.id) return;
      const distance = Math.abs(event.clientX - pointerStart.x);
      if (distance > 35) setTheme(Math.min(2, Math.floor(event.clientX / innerWidth * 3)));
      else setTheme((themeIndex + 1) % themes.length);
      pointerStart = null;
    });
    scene.addEventListener("pointercancel", () => { pointerStart = null; });

    function stopCamera() {
      cancelAnimationFrame(cameraFrame);
      stream?.getTracks().forEach(track => track.stop());
      stream = null;
      camera.srcObject = null;
      lastHand = null;
      scene.classList.remove("has-pointer");
      cameraButton.textContent = "웹캠으로 손짓하기";
      cameraButton.disabled = false;
      status.textContent = "웹캠을 껐어요. 마우스로 계속 둘러볼 수 있어요.";
    }
    async function trackHands(time) {
      if (!stream) return;
      if (handLandmarker && camera.readyState >= 2 && camera.currentTime !== lastVideoTime && time - lastCheck > 90) {
        lastCheck = time;
        lastVideoTime = camera.currentTime;
        try {
          const hands = handLandmarker.detectForVideo(camera, time).landmarks;
          if (hands.length) {
            const palm = hands[0][9];
            const point = { x: 1 - palm.x, y: palm.y };
            const movement = lastHand ? Math.hypot(point.x - lastHand.x, point.y - lastHand.y) : 0;
            if (movement > .012) {
              const bounds = scene.getBoundingClientRect();
              moveLight(bounds.left + point.x * bounds.width, bounds.top + point.y * bounds.height);
              wake();
              const index = Math.min(2, Math.floor(point.x * 3));
              if (time - lastThemeChange > 450) { setTheme(index); lastThemeChange = time; }
            }
            lastHand = point;
          } else lastHand = null;
        } catch {
          status.textContent = "손짓 인식이 멈췄어요. 웹캠을 다시 켜 주세요.";
          stopCamera();
          return;
        }
      }
      cameraFrame = requestAnimationFrame(trackHands);
    }
    cameraButton.addEventListener("click", async () => {
      if (stream) { stopCamera(); return; }
      cameraButton.disabled = true;
      status.textContent = "웹캠과 손짓 인식을 준비하고 있어요…";
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw Error("localhost 주소에서 열어 주세요.");
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
        camera.srcObject = stream;
        await camera.play();
        const { FilesetResolver, HandLandmarker } = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs");
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm");
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task", delegate: "CPU" },
          runningMode: "VIDEO", numHands: 1
        });
        cameraButton.textContent = "웹캠 끄기";
        cameraButton.disabled = false;
        status.textContent = "손을 좌우로 움직여 초록·파랑·분홍 숲을 만나 보세요.";
        cameraFrame = requestAnimationFrame(trackHands);
      } catch (error) {
        stopCamera();
        status.textContent = error.name === "NotAllowedError"
          ? "크롬에서 카메라 사용을 허용해 주세요."
          : "웹캠 또는 손짓 인식을 시작하지 못했어요. 카메라와 인터넷 연결을 확인해 주세요. " + error.message;
      }
    });
    window.addEventListener("pagehide", () => { if (stream) stopCamera(); });
  </script>
</body>
</html>
