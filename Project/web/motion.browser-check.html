<!doctype html><meta charset="utf-8"><title>Moving poster browser checks</title>
<style>body{background:#102437;color:#e4f0f7;font:15px system-ui;padding:20px}iframe{width:960px;height:540px;border:1px solid #5d8499}li{margin:8px}</style>
<h1>무빙 포스터 브라우저 검사</h1><p>가상 동작 · QA 저장소만 사용 · 실제 관객 수에 포함하지 않음</p><ol id="results"></ol>
<iframe id="app" src="/?test=1"></iframe>
<script type="module">
import {createMotionRecord,demoFrames,renderMotion,poseAt} from './motion.mjs';
const out=document.querySelector('#results'),frame=document.querySelector('#app');
function report(ok,text){const li=document.createElement('li');li.textContent=(ok?'PASS — ':'FAIL — ')+text;out.append(li);if(!ok)throw new Error(text);}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn,timeout=15000){const start=performance.now();while(!fn()){if(performance.now()-start>timeout)throw Error('timeout');await wait(100);}}
try{
 const c=document.createElement('canvas');c.width=640;c.height=360;const ctx=c.getContext('2d',{willReadFrequently:true}),r=createMotionRecord(demoFrames(),0);
 renderMotion(ctx,r,640,360,1000);const a=ctx.getImageData(0,0,640,360).data;ctx.clearRect(0,0,640,360);renderMotion(ctx,r,640,360,6000);const b=ctx.getImageData(0,0,640,360).data;
 let diff=0;for(let i=0;i<a.length;i+=4)if(Math.abs(a[i]-b[i])+Math.abs(a[i+3]-b[i+3])>10)diff++;
 report(diff>3000,'다른 시점의 실제 잔상 픽셀이 달라짐 (마지막 자세 정지화면 아님)');
 await until(()=>frame.contentWindow.motionQA);let qa=frame.contentWindow.motionQA;const before=qa.snapshot().count;
 qa.startFixture();await until(()=>qa.snapshot().frames>=30);report(qa.snapshot().state==='recording','기록 중 30개 이상 프레임 누적: '+JSON.stringify(qa.snapshot()));
 await until(()=>qa.snapshot().state==='result');report(qa.snapshot().latest?.frames>=120&&qa.snapshot().count===before+1,'10초 종료: 120개 이상 동작 프레임 저장, 인원 1 증가');
 const saved=await qa.readSaved();const record=saved.sort((a,b)=>a.created-b.created).at(-1);
 report(record.duration===10000&&JSON.stringify(poseAt(record,1000))!==JSON.stringify(poseAt(record,6000)),'IndexedDB에 앞/뒤 움직임과 10초 타임라인 보존');
 frame.src='/?test=1&reload='+Date.now();await until(()=>frame.contentWindow.motionQA&&frame.contentWindow.motionQA!==qa);qa=frame.contentWindow.motionQA;
 report(qa.snapshot().count===before+1,'새로고침 후 누적 기록 복원');
 qa.start();await until(()=>qa.snapshot().state==='result');report(qa.snapshot().count===before+1&&qa.snapshot().rehearsal,'리허설은 10초 재생되지만 참여 수와 저장소를 증가시키지 않음');
 document.title='PASS — moving poster browser checks';
}catch(e){const li=document.createElement('li');li.textContent='FAIL — '+e.message;out.append(li);document.title='FAIL — moving poster browser checks';}
</script>
